# Warden CI Pipeline (VS Code extension)
#
# Runs deterministic checks on every pull request and push to master.
# Extension-host tests launch a real VS Code/Electron instance, so on Linux
# CI they must run under a virtual display (xvfb-run).

name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Test (headless VS Code)
        run: xvfb-run -a npm run test

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o extension.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: extension.vsix
